<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEBROOM Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .admin-header {
            background: linear-gradient(135deg, #8A2BE2, #9370DB);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .admin-header h1 {
            color: white;
            margin: 0;
        }
        
        .admin-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .admin-section h2 {
            color: var(--accent-gold);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        
        .btn-admin {
            background: linear-gradient(135deg, #1E90FF, #4169E1);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(30, 144, 255, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #FF4757, #FF3838);
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .data-table th {
            color: var(--accent-gold);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        
        .export-section {
            text-align: center;
            padding: 40px;
            background: rgba(255, 215, 0, 0.05);
            border-radius: 16px;
            margin-top: 40px;
        }
        
        .password-protect {
            text-align: center;
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .password-protect h2 {
            color: var(--accent-gold);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="admin-container" id="adminPanel" style="display: none;">
        <div class="admin-header">
            <h1><i class="fas fa-crown"></i> LEBROOM Admin Panel</h1>
        </div>
        
        <!-- Управление игроками -->
        <div class="admin-section">
            <h2><i class="fas fa-users"></i> Управление игроками</h2>
            
            <div class="form-group">
                <label>Добавить нового игрока</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px;">
                    <input type="text" id="playerName" class="form-control" placeholder="Имя игрока">
                    <input type="number" id="playerPoints" class="form-control" placeholder="Начальные очки" value="0">
                    <button onclick="addPlayer()" class="btn-admin">
                        <i class="fas fa-plus"></i> Добавить
                    </button>
                </div>
            </div>
            
            <table class="data-table" id="playersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Очки</th>
                        <th>Турниров</th>
                        <th>Побед</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="playersList">
                    <!-- Заполняется через JS -->
                </tbody>
            </table>
        </div>
        
        <!-- Управление турнирами -->
        <div class="admin-section">
            <h2><i class="fas fa-trophy"></i> Управление турнирами</h2>
            
            <div class="form-group">
                <label>Создать новый турнир</label>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px;">
                    <input type="text" id="tournamentTitle" class="form-control" placeholder="Название турнира">
                    <input type="text" id="tournamentDate" class="form-control" placeholder="Дата (ДД.ММ)">
                    <input type="text" id="tournamentTime" class="form-control" placeholder="Время (ЧЧ:ММ)">
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px;">
                    <input type="number" id="tournamentSeats" class="form-control" placeholder="Кол-во мест" value="100">
                    <input type="text" id="tournamentBuyIn" class="form-control" placeholder="Бай-ин (5 000 ₽)">
                    <input type="text" id="tournamentPrize" class="form-control" placeholder="Призовой фонд">
                </div>
                <textarea id="tournamentDesc" class="form-control" placeholder="Описание турнира" rows="2"></textarea>
                <button onclick="addTournament()" class="btn-admin" style="margin-top: 12px;">
                    <i class="fas fa-plus"></i> Создать турнир
                </button>
            </div>
            
            <table class="data-table" id="tournamentsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Дата/Время</th>
                        <th>Записано</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="tournamentsList">
                    <!-- Заполняется через JS -->
                </tbody>
            </table>
        </div>
        
        <!-- Итоги турнира -->
        <div class="admin-section">
            <h2><i class="fas fa-flag-checkered"></i> Подвести итоги турнира</h2>
            
            <div class="form-group">
                <label>Выберите турнир</label>
                <select id="finishTournamentSelect" class="form-control">
                    <option value="">-- Выберите турнир --</option>
                </select>
            </div>
            
            <div id="tournamentResults" style="display: none;">
                <h3 style="color: var(--accent-cyan); margin-bottom: 20px;">Введите результаты</h3>
                <div id="resultsForm">
                    <!-- Динамически создается -->
                </div>
                <button onclick="finishTournament()" class="btn-admin">
                    <i class="fas fa-check"></i> Завершить турнир
                </button>
            </div>
        </div>
        
        <!-- Экспорт/Импорт данных -->
        <div class="export-section">
            <h2><i class="fas fa-database"></i> Управление данными</h2>
            
            <div style="display: flex; gap: 20px; justify-content: center; margin-top: 20px;">
                <button onclick="exportData()" class="btn-admin">
                    <i class="fas fa-download"></i> Экспорт данных
                </button>
                <button onclick="showImport()" class="btn-admin">
                    <i class="fas fa-upload"></i> Импорт данных
                </button>
                <button onclick="resetData()" class="btn-admin btn-danger">
                    <i class="fas fa-trash"></i> Сбросить данные
                </button>
            </div>
            
            <div id="importSection" style="display: none; margin-top: 30px;">
                <textarea id="importData" class="form-control" placeholder="Вставьте JSON данные" rows="6"></textarea>
                <button onclick="importData()" class="btn-admin" style="margin-top: 12px;">
                    <i class="fas fa-check"></i> Импортировать
                </button>
            </div>
        </div>
    </div>
    
    <!-- Защита паролем -->
    <div class="password-protect" id="loginPanel">
        <h2><i class="fas fa-lock"></i> Панель администратора</h2>
        <input type="password" id="adminPassword" class="form-control" placeholder="Введите пароль" style="margin-bottom: 20px;">
        <button onclick="checkPassword()" class="btn-admin" style="width: 100%;">
            <i class="fas fa-sign-in-alt"></i> Войти
        </button>
        <p style="color: var(--text-secondary); margin-top: 20px; font-size: 14px;">
            По умолчанию пароль: <code>admin123</code>
        </p>
    </div>
    
    <script src="data-manager.js"></script>
    <script>
        // Защита паролем
        const ADMIN_PASSWORD = 'admin123';
        
        function checkPassword() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadAdminData();
            } else {
                alert('Неверный пароль!');
            }
        }
        
        function loadAdminData() {
            loadPlayers();
            loadTournaments();
            loadTournamentSelect();
        }
        
        // Управление игроками
        function loadPlayers() {
            const players = dataManager.players;
            const tbody = document.getElementById('playersList');
            tbody.innerHTML = '';
            
            players.forEach(player => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${player.id}</td>
                    <td>${player.name}</td>
                    <td>${player.points}</td>
                    <td>${player.tournaments}</td>
                    <td>${player.wins}</td>
                    <td class="action-buttons">
                        <button onclick="editPlayer(${player.id})" class="action-btn" style="background: var(--accent-blue); color: white;">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deletePlayer(${player.id})" class="action-btn" style="background: var(--accent-red); color: white;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        function addPlayer() {
            const name = document.getElementById('playerName').value;
            const points = parseInt(document.getElementById('playerPoints').value);
            
            if (!name) {
                alert('Введите имя игрока');
                return;
            }
            
            dataManager.addPlayer({
                name: name,
                points: points,
                tournaments: 0,
                wins: 0
            });
            
            document.getElementById('playerName').value = '';
            document.getElementById('playerPoints').value = '0';
            loadPlayers();
            alert('Игрок добавлен!');
        }
        
        function editPlayer(playerId) {
            const player = dataManager.findPlayerById(playerId);
            if (!player) return;
            
            const newPoints = prompt(`Изменить очки для ${player.name}:`, player.points);
            if (newPoints !== null) {
                dataManager.updatePlayer(playerId, { points: parseInt(newPoints) });
                loadPlayers();
            }
        }
        
        function deletePlayer(playerId) {
            if (confirm('Удалить игрока? Это действие нельзя отменить.')) {
                dataManager.deletePlayer(playerId);
                loadPlayers();
            }
        }
        
        // Управление турнирами
        function loadTournaments() {
            const tournaments = dataManager.tournaments;
            const tbody = document.getElementById('tournamentsList');
            tbody.innerHTML = '';
            
            tournaments.forEach(tournament => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${tournament.id}</td>
                    <td>${tournament.title}</td>
                    <td>${tournament.date} ${tournament.time}</td>
                    <td>${tournament.registeredPlayers?.length || 0}/${tournament.totalSeats}</td>
                    <td>
                        <span style="color: ${tournament.status === 'active' ? '#10b981' : '#94a3b8'}">
                            ${tournament.status === 'active' ? 'Активен' : 'Завершен'}
                        </span>
                    </td>
                    <td class="action-buttons">
                        <button onclick="viewTournament(${tournament.id})" class="action-btn" style="background: var(--accent-cyan); color: white;">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button onclick="deleteTournament(${tournament.id})" class="action-btn" style="background: var(--accent-red); color: white;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        function loadTournamentSelect() {
            const select = document.getElementById('finishTournamentSelect');
            const tournaments = dataManager.tournaments.filter(t => !t.finished);
            
            select.innerHTML = '<option value="">-- Выберите турнир --</option>';
            tournaments.forEach(tournament => {
                const option = document.createElement('option');
                option.value = tournament.id;
                option.textContent = `${tournament.title} (${tournament.date})`;
                select.appendChild(option);
            });
        }
        
        function addTournament() {
            const title = document.getElementById('tournamentTitle').value;
            const date = document.getElementById('tournamentDate').value;
            const time = document.getElementById('tournamentTime').value;
            const seats = parseInt(document.getElementById('tournamentSeats').value);
            const buyIn = document.getElementById('tournamentBuyIn').value;
            const prize = document.getElementById('tournamentPrize').value;
            const desc = document.getElementById('tournamentDesc').value;
            
            if (!title || !date || !time) {
                alert('Заполните обязательные поля: название, дата, время');
                return;
            }
            
            // Деактивируем все старые турниры
            dataManager.tournaments.forEach(t => {
                if (t.status === 'active') {
                    t.status = 'inactive';
                }
            });
            
            dataManager.addTournament({
                title: title,
                date: date,
                time: time,
                totalSeats: seats,
                registeredCount: 0,
                buyIn: buyIn,
                prizePool: prize,
                description: desc,
                status: 'active'
            });
            
            // Очищаем форму
            ['tournamentTitle', 'tournamentDate', 'tournamentTime', 
             'tournamentSeats', 'tournamentBuyIn', 'tournamentPrize', 
             'tournamentDesc'].forEach(id => {
                document.getElementById(id).value = '';
            });
            
            document.getElementById('tournamentSeats').value = '100';
            
            loadTournaments();
            loadTournamentSelect();
            alert('Турнир создан!');
        }
        
        function viewTournament(tournamentId) {
            const tournament = dataManager.tournaments.find(t => t.id === tournamentId);
            if (!tournament) return;
            
            let message = `Турнир: ${tournament.title}\n`;
            message += `Дата: ${tournament.date} ${tournament.time}\n`;
            message += `Мест: ${tournament.registeredPlayers?.length || 0}/${tournament.totalSeats}\n`;
            message += `Бай-ин: ${tournament.buyIn}\n`;
            message += `Призовой: ${tournament.prizePool}\n`;
            message += `Описание: ${tournament.description}\n`;
            
            if (tournament.registeredPlayers?.length > 0) {
                message += '\nЗаписанные игроки:\n';
                tournament.registeredPlayers.forEach((playerId, index) => {
                    const player = dataManager.findPlayerById(playerId);
                    if (player) {
                        message += `${index + 1}. ${player.name}\n`;
                    }
                });
            }
            
            alert(message);
        }
        
        function deleteTournament(tournamentId) {
            if (confirm('Удалить турнир? Все записи на него также будут удалены.')) {
                dataManager.deleteTournament(tournamentId);
                loadTournaments();
                loadTournamentSelect();
            }
        }
        
        // Завершение турнира
        document.getElementById('finishTournamentSelect').addEventListener('change', function() {
            const tournamentId = parseInt(this.value);
            const tournament = dataManager.tournaments.find(t => t.id === tournamentId);
            
            const resultsDiv = document.getElementById('tournamentResults');
            const formDiv = document.getElementById('resultsForm');
            
            if (tournament && tournament.registeredPlayers?.length > 0) {
                resultsDiv.style.display = 'block';
                formDiv.innerHTML = '';
                
                tournament.registeredPlayers.forEach((playerId, index) => {
                    const player = dataManager.findPlayerById(playerId);
                    if (player) {
                        const div = document.createElement('div');
                        div.style.display = 'flex'; 
                        div.style.gap = '10px'; 
                        div.style.marginBottom = '10px'; 
                        div.style.alignItems = 'center';
                        
                        div.innerHTML = `
                            <span style="min-width: 200px;">${index + 1}. ${player.name}</span>
                            <input type="number" id="position_${playerId}" 
                                   class="form-control" placeholder="Место" 
                                   style="width: 80px;" value="${index + 1}">
                            <input type="number" id="points_${playerId}" 
                                   class="form-control" placeholder="Очки" 
                                   style="width: 100px;" value="${100 - index * 10}">
                            <input type="text" id="prize_${playerId}" 
                                   class="form-control" placeholder="Приз" 
                                   style="flex: 1;">
                        `;
                        formDiv.appendChild(div);
                    }
                });
            } else {
                resultsDiv.style.display = 'none';
            }
        });
        
        function finishTournament() {
            const tournamentId = parseInt(document.getElementById('finishTournamentSelect').value);
            const tournament = dataManager.tournaments.find(t => t.id === tournamentId);
            
            if (!tournament) {
                alert('Выберите турнир');
                return;
            }
            
            const results = [];
            
            tournament.registeredPlayers.forEach(playerId => {
                const position = parseInt(document.getElementById(`position_${playerId}`).value) || 1;
                const points = parseInt(document.getElementById(`points_${playerId}`).value) || 0;
                const prize = document.getElementById(`prize_${playerId}`).value || '';
                
                results.push({
                    playerId: playerId,
                    position: position,
                    pointsEarned: points,
                    prize: prize
                });
            });
            
            // Сортируем по позиции
            results.sort((a, b) => a.position - b.position);
            
            if (confirm(`Завершить турнир "${tournament.title}"? Это обновит статистику всех игроков.`)) {
                dataManager.finishTournament(tournamentId, results);
                loadTournaments();
                loadPlayers();
                loadTournamentSelect();
                document.getElementById('tournamentResults').style.display = 'none';
                alert('Турнир завершен! Статистика обновлена.');
            }
        }
        
        // Экспорт/Импорт данных
        function exportData() {
            const data = dataManager.exportData();
            const dataStr = JSON.stringify(data, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = `lebroom_data_${new Date().toISOString().split('T')[0]}.json`;
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            
            alert('Данные экспортированы!');
        }
        
        function showImport() {
            document.getElementById('importSection').style.display = 'block';
        }
        
        function importData() {
            const dataStr = document.getElementById('importData').value;
            
            if (!dataStr) {
                alert('Введите данные для импорта');
                return;
            }
            
            try {
                const data = JSON.parse(dataStr);
                
                if (confirm('Импортировать данные? Текущие данные будут перезаписаны.')) {
                    dataManager.importData(data);
                    loadAdminData();
                    document.getElementById('importData').value = '';
                    document.getElementById('importSection').style.display = 'none';
                    alert('Данные импортированы!');
                }
            } catch (error) {
                alert('Ошибка при импорте данных: ' + error.message);
            }
        }
        
        function resetData() {
            if (confirm('ВНИМАНИЕ: Это удалит ВСЕ данные (игроков, турниры). Продолжить?')) {
                localStorage.clear();
                location.reload();
            }
        }
        
        // Экспорт функций в глобальную область видимости
        window.addPlayer = addPlayer;
        window.editPlayer = editPlayer;
        window.deletePlayer = deletePlayer;
        window.addTournament = addTournament;
        window.viewTournament = viewTournament;
        window.deleteTournament = deleteTournament;
        window.finishTournament = finishTournament;
        window.exportData = exportData;
        window.showImport = showImport;
        window.importData = importData;
        window.resetData = resetData;
        window.checkPassword = checkPassword;
    </script>
</body>
</html>
